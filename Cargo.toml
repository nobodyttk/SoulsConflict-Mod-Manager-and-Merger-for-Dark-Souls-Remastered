[package]
name = "souls_conflict"
version = "2.0.3"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
image = "0.24"
rars = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.16"
wry = "0.24"
zip = "2.2"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
